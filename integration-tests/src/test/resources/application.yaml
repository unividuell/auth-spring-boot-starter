# Staging has no client: next to the key it would be a door past the lock.
spring:
  config:
    activate:
      on-profile: "!staging"
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-client-id
            client-secret: test-client-secret
---
unividuell:
  auth:
    frontend: spa
    roles:
      super-admin: test:prof
    csrf-cookie:
      excluded-paths: /api/public/**
